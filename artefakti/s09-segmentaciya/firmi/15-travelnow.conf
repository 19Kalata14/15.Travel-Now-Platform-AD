# МИС, Час 9. Конфигурация на сегментите: travelnow (Туризъм, плащания)
# Изискванията от сценария (курсовата работа):
#   1. Контактен център към Booking API (8080): разрешено
#   2. Контактен център към Payment GW (8443): ЗАБРАНЕНО
#   3. Партньори към B2B API (8080/api/b2b): само HTTPS, само от 10.142.0.0/24
#   4. Payment GW (8443) достъпен само от Tech мрежата (10.140.0.0/24)
#   5. Изолирайте PCI зоната: Payment не комуникира с нищо освен Tech мрежата
# Бележка:
#   Payment и Booking са в една мрежа: gw не вижда трафика между тях. Изискване 5 иска
#   микросегментация (отделен сегмент или стена на самия Payment). Пътят /api/b2b е ниво 7: пакетен
#   филтър не го вижда.

firma travelnow

segment hq       10.140.0.0/24 10.140.0.1
segment montana  10.141.0.0/24 10.141.0.1
segment kyustend 10.142.0.0/24 10.142.0.1
segment inet       203.0.113.0/24  203.0.113.1    # "интернетът" (симулиран); адресът на gw тук е публичният му адрес
host    inet       203.0.113.50    vanshen-klient
host    inet       203.0.113.80    vanshen-server
usluga  203.0.113.80  80   tcp  vanshen-http
usluga  203.0.113.80  443  tcp  vanshen-https
host hq       10.140.0.30 tech
host hq       10.140.0.10 payment-gw
host hq       10.140.0.20 booking-api
host montana  10.141.0.20 crm-terminal
host kyustend 10.142.0.20 b2b-klient
usluga 10.140.0.10 8443 tcp payment
usluga 10.140.0.20 8080 tcp booking-api
